# CI for hybrid-calibration
# Scripts without a test suite; CI byte-compiles them and checks links.
# Generated by the enterprise-hardening pass (2026-10-04) against the repository's
# actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Byte-compile every tracked Python file
        # The first version ran `compileall -q . || echo "no Python sources tracked"`,
        # which cannot fail: a syntax error in any tracked file was reported and then
        # swallowed, and the message claimed there were no Python sources when the
        # repository has hundreds. These repositories do have sources, so the || branch
        # is now reserved for the case it describes.
        run: |
          set -uo pipefail
          if git ls-files '*.py' | grep -q .; then
            python -m compileall -q .
          else
            echo "no Python sources tracked"
          fi
      - name: Check that every relative Markdown link resolves
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git' in md.parts or '.venv' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'\]\(([^)#][^)]*)\)', text):
                  target = m.group(1).split('#')[0].strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if not (md.parent / target).exists():
                      bad.append(f'{md}: {target}')
          if bad:
              print('broken relative links:')
              print('\n'.join(bad[:60]))
              sys.exit(1)
          print('all relative Markdown links resolve')
          PY
  mutation-control:
    name: The byte-compile gate can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Break one tracked Python file and require a non-zero exit
        run: |
          set -euo pipefail
          # The reverse control has to show two things, or it shows nothing: that the
          # gate passes when the tree is clean, and that it fails after the corruption.
          # Checking only the second is satisfied by anything that exits non-zero,
          # including "python: command not found" — an earlier version of this file did
          # exactly that and reported OK for a gate it never ran.
          echo "--- baseline: the gate must pass on the clean tree ---"
          if ! bash -c '
            set -uo pipefail
            if [ -n "$(git ls-files "*.py")" ]; then
              python -m compileall -q .
            else
              echo "no Python sources tracked"
            fi
          '; then
            echo "FAIL: the byte-compile gate is already red on an unmodified checkout,"
            echo "      so a failure after corrupting a file would prove nothing"
            exit 1
          fi
          echo "baseline passed"

          target=$(git ls-files '*.py' | sed -n '1p')
          if [ -z "$target" ]; then
            echo "no Python sources tracked, so there is nothing to corrupt"
            exit 0
          fi
          echo "--- corrupting $target ---"
          # The baseline pass above left a .pyc for every tracked source, and
          # compileall treats a cache as fresh whenever int(st_mtime) still matches
          # without comparing file size. A corruption landing in the same
          # wall-clock second is therefore skipped and the gate calls a broken file
          # clean -- which is exactly how this control failed on its first run.
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
          printf '\n\ndef __mutation_control__(:\n' >> "$target"
          if bash -c '
            set -uo pipefail
            if [ -n "$(git ls-files "*.py")" ]; then
              python -m compileall -q .
            else
              echo "no Python sources tracked"
            fi
          '; then
            echo "FAIL: the byte-compile gate accepted a file with a syntax error"
            exit 1
          fi
          echo "OK: the byte-compile gate rejected the corrupted file"

  secret-scan:
    # .gitleaks.toml and .pre-commit-config.yaml are present, but a pre-commit
    # hook is opt-in, missing from a fresh clone (.git/hooks holds only *.sample),
    # bypassable with `git commit --no-verify`, and only ever inspects staged
    # content -- never history. Nothing in CI looked at secrets, so a committed
    # key would have left every other check green.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - name: gitleaks (full history, CLI)
        # The gitleaks-action v2 was here first and turned every Dependabot pull
        # request red with "GITHUB_TOKEN is now required to scan pull requests" --
        # a failure caused by the action's requirements, not by the repository.
        # Dependabot runs the workflow from its own branch, so fixing it on main
        # does not help until the PR is regenerated. The CLI needs no token, scans
        # the same checked-out history, and has one fewer moving part.
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
